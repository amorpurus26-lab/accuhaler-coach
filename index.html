<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">

<title>สอนใช้ยาพ่น Accuhaler | โรงพยาบาลเนินขาม</title>
<style>
:root{--green:#086642;--gold:#dbb337;--ink:#17362c;--muted:#61756b;--bg:#f2f8f5;--line:#d9e7df}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",Tahoma,sans-serif;color:var(--ink);background:var(--bg)}
.app{max-width:530px;min-height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 30px #0a5d3312}
.top{display:flex;align-items:center;gap:10px;padding:9px 16px 8px;border-bottom:1px solid var(--line);min-height:72px}
.logo{width:53px;height:53px;object-fit:contain;flex:none}
.hospital{font-size:17px;font-weight:800;color:var(--green);line-height:1.22}
.sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.progress{padding:11px 18px 4px}
.progline{display:flex;justify-content:space-between;align-items:center;font-weight:750;font-size:14px}
.track{height:7px;border-radius:20px;background:#e4ede7;overflow:hidden;margin-top:8px}
.fill{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}
.content{flex:1;display:flex;flex-direction:column;padding:9px 16px 6px;min-height:0}
.art{position:relative;flex:1;min-height:165px;max-height:360px;background:#f5faf7;border:1px solid #e5eee9;border-radius:22px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art svg{width:100%;height:100%;max-height:340px;min-height:160px}
.art:after{content:"ภาพสาธิต";position:absolute;top:12px;left:14px;color:#648477;font-size:11px}
.caption{min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 5px 3px}
.stephead{font-size:clamp(22px,6.2vw,30px);font-weight:850;line-height:1.3;margin:0}
.instruction{margin:8px 0 0;line-height:1.5;font-size:clamp(17px,4.7vw,21px);font-weight:550}
.tip{min-height:30px;text-align:center;color:#687a70;font-size:12px;padding:2px 14px}
.bottom{padding:10px 16px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
.nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.btn{min-height:54px;border-radius:15px;font-size:19px;font-weight:800;cursor:pointer;border:0;font-family:inherit;touch-action:manipulation}
.secondary{background:#eaf3ee;color:var(--green)}
.primary{background:var(--green);color:white}
.btn:disabled{opacity:.38;cursor:default}
.utility{display:flex;justify-content:center;gap:12px;padding-top:10px}
.utility button{background:none;border:0;color:#557569;font-size:13px;font-family:inherit;padding:5px 10px;cursor:pointer}
.announce{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.motion{transform-origin:50% 50%;animation:bob 2.7s ease-in-out infinite}.slide{animation:slide 2.8s ease-in-out infinite}.breath{animation:breath 2.6s ease-in-out infinite;transform-origin:center}.click{animation:click 2.8s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}@keyframes slide{0%,15%{transform:translateX(0)}40%,80%{transform:translateX(28px)}100%{transform:translateX(0)}}@keyframes breath{0%,100%{opacity:.25;transform:translateX(0)}50%{opacity:1;transform:translateX(12px)}}@keyframes click{0%,32%,90%{opacity:.2}38%,72%{opacity:1}}
@media(max-height:690px){.top{min-height:59px;padding:5px 12px}.logo{height:43px;width:43px}.hospital{font-size:15px}.progress{padding:7px 16px 3px}.content{padding:5px 12px 4px}.art{min-height:145px}.caption{min-height:95px;padding:5px}.stephead{font-size:22px}.instruction{font-size:17px;margin-top:5px}.tip{min-height:20px;font-size:11px}.bottom{padding:7px 12px max(8px,env(safe-area-inset-bottom))}.btn{min-height:46px;font-size:17px}.utility{padding-top:4px}}
@media(prefers-reduced-motion:reduce){.motion,.slide,.breath,.click{animation:none!important}}
</style>
</head>

];

    <path d="M224 218 C248 205 259 206 271 222 C256 247 238 254 223 251 C214 243 213 226 224 218 Z" fill="${open?'#9b63e6':'#8b52db'}" stroke="#6c34ba" stroke-width="4"/>

function maleFace(){
  return `
  <g>
    <path d="M89 94 Q112 53 163 58 Q198 62 218 91 L215 112 Q195 88 158 88 Q119 89 95 114 Z" fill="#2c4038"/>
    <path d="M111 66 Q70 74 80 147 Q79 179 107 195 L115 234 Q161 250 188 214 L188 175 Q214 156 196 123 Q182 70 111 66Z" fill="#f3c5a2" stroke="#c98c70" stroke-width="3"/>
    <circle cx="137" cy="132" r="4" fill="#4f3b32"/><path d="M159 128 Q169 123 178 129" fill="none" stroke="#5a4036" stroke-width="4"/>
    <path d="M189 135 Q219 145 188 155" stroke="#c98c70" stroke-width="3" fill="none"/>
    <path d="M166 168 Q177 178 188 167" stroke="#8d4f46" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M102 230 L98 282 L220 282 L188 210" fill="#7fb7a3"/>
    <rect x="95" y="228" width="130" height="58" rx="22" fill="#79b4d0"/>

function breath(dir){
  return `<g class="breath" stroke="${dir==='out'?'#e6a63f':'#20a37a'}" stroke-width="6" fill="none" stroke-linecap="round"><path d="M220 125 Q260 110 294 126"/><path d="M220 150 Q265 150 302 153"/><path d="M220 176 Q260 192 294 180"/></g>`;
}
function startScene(){
  return `<svg viewBox="0 0 380 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="190" cy="292" rx="127" ry="10" fill="#dcebe3"/>${maleFace()}<g transform="translate(180 98) scale(.55)">${inhaler(true,false)}</g><circle cx="296" cy="84" r="32" fill="#eaf6ef" stroke="${green}" stroke-width="3"/><path d="M281 84 l10 10 18-22" stroke="${green}" stroke-width="8" fill="none" stroke-linecap="round"/></svg>`;
}
function scene(i){
  let content='';
  if(i===0) content=inhaler(false,false)+'<circle cx="293" cy="93" r="29" fill="#e6f5eb"/><path d="M280 93 l9 9 17-20" stroke="'+green+'" stroke-width="7" fill="none"/>';
  if(i===1) content=inhaler(true,false)+'<path class="slide" d="M255 269 h-66" stroke="'+green+'" stroke-width="10" stroke-linecap="round"/><path d="M189 258 l-18 11 18 11" fill="'+green+'"/>';
  if(i===2) content=inhaler(true,true)+'<path class="slide" d="M200 279 h65" stroke="'+green+'" stroke-width="8" stroke-linecap="round"/><path d="M260 267 l19 12 -19 12" fill="'+green+'"/>';
  if(i===3) content=maleFace()+breath('out')+'<circle cx="320" cy="210" r="35" fill="#fff0df"/><path d="M305 210 h30 m-15 -15 v30" stroke="#bd8b35" stroke-width="5"/>';
  if(i===4 || i===5) content=maleFace()+`<g transform="translate(155 112) scale(.50)">${inhaler(true,true)}</g>`+(i===5?`<path class="breath" d="M285 163 Q230 145 205 171" fill="none" stroke="${green}" stroke-width="10" stroke-linecap="round"/>`:``);
  if(i===6) content=maleFace()+`<circle cx="285" cy="122" r="49" fill="#e9f6ee" stroke="${green}" stroke-width="4"/><text x="285" y="134" font-size="34" font-weight="800" text-anchor="middle" fill="${green}">10</text><text x="285" y="166" font-size="13" text-anchor="middle" fill="${deep}">วินาที</text>`;
  if(i===7) content=inhaler(false,false)+'<path class="slide" d="M266 267 h-75" stroke="'+green+'" stroke-width="10" stroke-linecap="round"/><path d="M191 257 l-17 10 17 10" fill="'+green+'"/>';
  if(i===8) content=`<g class="motion"><path d="M160 81 l55 0 15 136 Q215 246 160 246 Q105 246 90 217 l15-136Z" fill="#eef9ff" stroke="#5a9ab3" stroke-width="5"/><path d="M101 170 Q160 153 218 170 L223 215 Q207 240 160 240 Q116 240 97 214Z" fill="#79c9ed" opacity=".75"/><path d="M127 73 h68" stroke="#5a9ab3" stroke-width="8" stroke-linecap="round"/><path d="M279 122 Q310 165 280 189 Q248 169 279 122Z" fill="#59a9cc"/><path d="M263 210 l12 12 30-35" stroke="${green}" stroke-width="9" fill="none" stroke-linecap="round"/></g>`;
  return `<svg viewBox="0 0 380 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="190" cy="292" rx="127" ry="10" fill="#dcebe3"/>${content}</svg>`;
}
let started=false;
let position=0;
const el=id=>document.getElementById(id);
function speakCurrent(){
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const s=steps[position];
    const u=new SpeechSynthesisUtterance(s.title+' '+s.say);
    u.lang='th-TH';
    u.rate=.88;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function render(){
  if(!started){
    el('stepnum').textContent='เริ่มต้นการฝึก';
    el('percent').textContent='0%';
    el('fill').style.width='0%';
    el('heading').textContent='พร้อมเริ่มฝึก';
    el('instruction').textContent='กด “เริ่ม” แล้วทำตามทีละขั้นตอน';
    el('tip').textContent='หากต้องการฟังซ้ำ กด “ฟังคำแนะนำ”';
    el('art').innerHTML=startScene();
    el('art').setAttribute('aria-label','ภาพเริ่มต้นการฝึก');
    el('back').disabled=true;
    el('next').textContent='เริ่ม';
    el('announce').textContent='พร้อมเริ่มฝึก';
    return;
  }
  const s=steps[position];
  el('stepnum').textContent=`ขั้นตอนที่ ${position+1} จาก ${steps.length}`;
  el('percent').textContent=`${Math.round((position+1)*100/steps.length)}%`;
  el('fill').style.width=((position+1)*100/steps.length)+'%';
  el('heading').textContent=s.title;
  el('instruction').textContent=s.say;
  el('tip').textContent=s.tip;
  el('art').innerHTML=scene(s.scene);
  el('art').setAttribute('aria-label','ภาพสาธิต: '+s.title);
  el('back').disabled=position===0;
  el('next').textContent=position===steps.length-1?'✓ เริ่มใหม่':'ทำแล้ว ถัดไป →';
  el('announce').textContent=s.title+' '+s.say;
}
el('back').onclick=()=>{
  if(!started) return;
  if(position>0){position--;render();}
};
el('next').onclick=()=>{
  if(!started){
    started=true;
    position=0;
    render();
    speakCurrent();
    return;
  }
  if(position===steps.length-1){
    started=false;
    position=0;
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    render();
    return;
  }
  position++;
  render();
  speakCurrent();
};
el('again').onclick=()=>{
  const a=el('art');
  a.innerHTML='';
  requestAnimationFrame(()=>a.innerHTML=started?scene(steps[position].scene):startScene());
};
el('speak').onclick=()=>{
  if(!started) return;
  if(!('speechSynthesis' in window)){alert('อุปกรณ์นี้ไม่รองรับเสียงอ่าน กรุณาอ่านข้อความบนหน้าจอ');return}
  speakCurrent();
};
render();
</script>
</body>
</html>
