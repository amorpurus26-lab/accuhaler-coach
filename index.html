<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#086642">
<title>สอนใช้ยาพ่น Accuhaler | โรงพยาบาลเนินขาม</title>
<style>
:root{--green:#086642;--gold:#dbb337;--ink:#17362c;--muted:#61756b;--bg:#f2f8f5;--line:#d9e7df;--purple:#8d52db;--purple2:#6e35c5;--skin:#e7bf9f;--hair:#243b35;--shirt:#8bb2c6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",Tahoma,sans-serif;color:var(--ink);background:var(--bg)}
.app{max-width:530px;min-height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 30px #0a5d3312}
.top{display:flex;align-items:center;gap:10px;padding:9px 16px 8px;border-bottom:1px solid var(--line);min-height:72px}.logo{width:53px;height:53px;object-fit:contain;flex:none}.hospital{font-size:17px;font-weight:800;color:var(--green);line-height:1.22}.sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.progress{padding:11px 18px 4px}.progline{display:flex;justify-content:space-between;align-items:center;font-weight:750;font-size:14px}.track{height:7px;border-radius:20px;background:#e4ede7;overflow:hidden;margin-top:8px}.fill{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .25s}
.content{flex:1;display:flex;flex-direction:column;padding:9px 16px 6px;min-height:0}.art{position:relative;flex:1;min-height:165px;max-height:360px;background:#f5faf7;border:1px solid #e5eee9;border-radius:22px;display:flex;align-items:center;justify-content:center;overflow:hidden}.art svg{width:100%;height:100%;max-height:340px;min-height:160px}.art:after{content:"ภาพสาธิต";position:absolute;top:12px;left:14px;color:#648477;font-size:11px}
.caption{min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 5px 3px}.stephead{font-size:clamp(22px,6.2vw,30px);font-weight:850;line-height:1.3;margin:0}.instruction{margin:8px 0 0;line-height:1.5;font-size:clamp(17px,4.7vw,21px);font-weight:550}.tip{min-height:34px;text-align:center;color:#687a70;font-size:12px;padding:2px 14px}.bottom{padding:10px 16px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}.nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}.btn{min-height:54px;border-radius:15px;font-size:19px;font-weight:800;cursor:pointer;border:0;font-family:inherit;touch-action:manipulation}.secondary{background:#eaf3ee;color:var(--green)}.primary{background:var(--green);color:white}.btn:disabled{opacity:.38;cursor:default}.utility{display:flex;justify-content:center;gap:12px;padding-top:10px}.utility button{background:none;border:0;color:#557569;font-size:13px;font-family:inherit;padding:5px 10px;cursor:pointer}.announce{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.note{margin:0 16px 10px;background:#f7fbf8;border:1px solid #e0ece5;border-radius:14px;padding:10px 12px;font-size:12px;line-height:1.5;color:#446255}
.motion{transform-origin:50% 50%;animation:bob 2.7s ease-in-out infinite}.slide{animation:slide 2.6s ease-in-out infinite}.breath{animation:breath 2.6s ease-in-out infinite;transform-origin:center}.click{animation:click 2.6s infinite}.pulse{animation:pulse 2.1s ease-in-out infinite}.blink{animation:blink 2.8s steps(1) infinite}
@keyframes bob{50%{transform:translateY(-5px)}}@keyframes slide{0%,15%{transform:translateX(0)}40%,80%{transform:translateX(22px)}100%{transform:translateX(0)}}@keyframes breath{0%,100%{opacity:.25;transform:translateX(0)}50%{opacity:1;transform:translateX(10px)}}@keyframes click{0%,30%,100%{opacity:.2}40%,75%{opacity:1}}@keyframes pulse{50%{transform:scale(1.04)}}@keyframes blink{0%,45%,100%{opacity:1}46%,49%{opacity:0.1}}
@media(max-height:690px){.top{min-height:59px;padding:5px 12px}.logo{height:43px;width:43px}.hospital{font-size:15px}.progress{padding:7px 16px 3px}.content{padding:5px 12px 4px}.art{min-height:145px}.caption{min-height:95px;padding:5px}.stephead{font-size:22px}.instruction{font-size:17px;margin-top:5px}.tip{min-height:24px;font-size:11px}.bottom{padding:7px 12px max(8px,env(safe-area-inset-bottom))}.btn{min-height:46px;font-size:17px}.utility{padding-top:4px}.note{margin:0 12px 8px;font-size:11px}}
@media(prefers-reduced-motion:reduce){.motion,.slide,.breath,.click,.pulse,.blink{animation:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <img class="logo" src="logo-noenkhamhospital.jpg" alt="ตราโรงพยาบาลเนินขาม">
  <div>
    <div class="hospital">โรงพยาบาลเนินขาม</div>
    <div class="sub">วิธีใช้ยาพ่นชนิดผงแห้ง Accuhaler</div>
  </div>
</header>
<section class="progress">
  <div class="progline"><span id="stepnum">เริ่มต้นการฝึก</span><span id="percent">0%</span></div>
  <div class="track"><div class="fill" id="fill"></div></div>
</section>
<section class="content">
  <div class="art" id="art" role="img" aria-label="ภาพสาธิตการใช้ยาพ่น"></div>
  <div class="caption">
    <h1 class="stephead" id="heading"></h1>
    <p class="instruction" id="instruction"></p>
  </div>
  <div class="tip" id="tip"></div>
</section>
<div class="note" id="note">หมายเหตุ: หลังใช้ยาพ่นที่มีสเตียรอยด์ ควรบ้วนปากด้วยน้ำแล้วบ้วนทิ้ง</div>
<footer class="bottom">
  <div class="nav">
    <button id="back" class="btn secondary">← ย้อนกลับ</button>
    <button id="next" class="btn primary">เริ่ม</button>
  </div>
  <div class="utility">
    <button id="again">↻ ดูภาพซ้ำ</button>
    <button id="speak">🔊 ฟังคำแนะนำ</button>
  </div>
</footer>
<span id="announce" class="announce" aria-live="polite"></span>
</main>
<script>
const steps=[
 {title:'เปิดฝาครอบ',say:'เปิดฝาครอบก่อนใช้ โดยจับตัวเครื่องด้วยมือซ้าย และใช้นิ้วหัวแม่มือขวาดันฝาครอบออกจนสุด',tip:'วางนิ้วให้มั่นคง แล้วเปิดจนสุด',scene:1},
 {title:'เลื่อนคันโยก',say:'ถืออุปกรณ์ในแนวราบ แล้วเลื่อนคันโยกไปจนสุดหนึ่งครั้ง เพื่อเตรียมยา',tip:'อย่าเขย่า และอย่าเลื่อนคันโยกซ้ำโดยไม่จำเป็น',scene:2},
 {title:'หายใจออก',say:'หายใจออกเบา ๆ ทางปาก โดยหันหน้าออกจากปากพ่น',tip:'อย่าหายใจออกเข้าตัวอุปกรณ์',scene:3},
 {title:'อมปากพ่นและสูดยา',say:'อมปากพ่นให้สนิท แล้วสูดลมหายใจเข้าทางปากให้ลึกและสม่ำเสมอ',tip:'สูดเข้าทางปาก ไม่ใช่ทางจมูก',scene:4},
 {title:'กลั้นหายใจ',say:'นำอุปกรณ์ออกจากปาก แล้วกลั้นหายใจประมาณ 10 วินาที หรือเท่าที่ทำได้',tip:'ช่วยให้ยาลงปอดได้ดีขึ้น',scene:5},
 {title:'หายใจออกช้า ๆ',say:'ค่อย ๆ หายใจออกตามปกติ หลังจากกลั้นหายใจเสร็จ',tip:'หายใจออกช้า ๆ และผ่อนคลาย',scene:6},
 {title:'ปิดฝาครอบ',say:'ใช้นิ้วหัวแม่มือเลื่อนฝาครอบกลับเข้าที่ให้เรียบร้อย',tip:'ปิดฝาให้สนิททุกครั้งหลังใช้',scene:7}
];
const purple='#8b52db', purpleDark='#6a2db8', purpleLight='#b38bf0', skin='#e6bea0', shirt='#8db6c7', hair='#28423a', gold='#e0ab3d', green='#086642', deep='#074c33';
const el=id=>document.getElementById(id);
let started=false, position=0;
function speakCurrent(){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const s=steps[position];
    const u=new SpeechSynthesisUtterance(s.title+' '+s.say);
    const voices=speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
    const thai=voices.find(v=>/^th/i.test(v.lang)) || voices.find(v=>v.lang && v.lang.toLowerCase().includes('th'));
    if(thai) u.voice=thai;
    u.lang=thai?.lang || 'th-TH';
    u.rate=.92; u.pitch=1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function inhaler(open=false,lever=false){
  return `
  <g class="motion">
    <defs>
      <radialGradient id="bodyGrad" cx="38%" cy="30%" r="75%"><stop offset="0%" stop-color="#ae87ef"/><stop offset="55%" stop-color="${purple}"/><stop offset="100%" stop-color="${purpleDark}"/></radialGradient>
      <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c9acf7"/><stop offset="100%" stop-color="${purple}"/></linearGradient>
    </defs>
    <circle cx="192" cy="178" r="105" fill="url(#bodyGrad)" stroke="#6c34ba" stroke-width="4"/>
    <path d="M119 84 C86 107 71 142 72 182 C72 221 87 254 121 274" fill="none" stroke="#6d2eb5" stroke-width="10" stroke-linecap="round"/>
    <path d="M126 92 C97 112 84 144 84 181 C84 215 96 244 124 264" fill="none" stroke="#6d2eb5" stroke-width="7.2" stroke-linecap="round"/>
    <path d="M134 100 C109 118 98 145 98 181 C98 209 107 234 130 253" fill="none" stroke="#6d2eb5" stroke-width="4.7" stroke-linecap="round"/>
    <ellipse cx="188" cy="135" rx="59" ry="45" fill="#fbfbfd" stroke="#ddd7e9" stroke-width="3.2"/>
    <path d="M228 97 A44 40 0 0 1 245 171 L221 171 A24 25 0 0 0 211 111 Z" fill="#f0b14b"/>
    <circle cx="170" cy="116" r="2" fill="#8b8d91"/><circle cx="170" cy="124" r="2" fill="#8b8d91"/><circle cx="170" cy="132" r="2" fill="#8b8d91"/><circle cx="170" cy="140" r="2" fill="#8b8d91"/>
    <path d="M181 113 h37" stroke="#79838b" stroke-width="2.5" stroke-linecap="round"/><path d="M181 123 h43" stroke="#79838b" stroke-width="2.5" stroke-linecap="round"/><path d="M181 133 h34" stroke="#79838b" stroke-width="2.5" stroke-linecap="round"/><path d="M181 143 h27" stroke="#79838b" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="220" y="202" width="27" height="23" rx="10" fill="#ffffff" stroke="#cfc3e2" stroke-width="2.5"/>
    <text x="233.5" y="218" font-size="12" text-anchor="middle" font-weight="800" fill="#4b4f69">24</text>
    <path d="M225 216 C249 204 261 205 273 221 C258 247 237 255 222 252 C214 244 214 225 225 216 Z" fill="${open?'url(#capGrad)':'url(#bodyGrad)'}" stroke="#6c34ba" stroke-width="4"/>
    ${open?'<path d="M247 215 C267 204 287 205 300 219" fill="none" stroke="#caaff4" stroke-width="4" stroke-linecap="round"/>':''}
    ${lever?'<path d="M183 240 l24 13 31 -16" stroke="#dfbc4e" fill="none" stroke-width="13" stroke-linecap="round"/>':''}
  </g>`;
}
function faceBase(dir='right', mouth='smile'){
  const flip=dir==='left'?'translate(330,0) scale(-1,1)':'translate(0,0)';
  const mouthPath = mouth==='open' ? '<path d="M196 170 q12 10 24 0 q-1 14 -12 16 q-11 -2 -12 -16z" fill="#b86a61"/>' : mouth==='inhale' ? '<ellipse cx="208" cy="173" rx="7" ry="9" fill="#b86a61"/>' : '<path d="M193 172 q14 10 24 0" fill="none" stroke="#9c5d54" stroke-width="4" stroke-linecap="round"/>';
  return `<g transform="${flip}">
      <path d="M92 102 q18-42 66-49 q54-7 84 21 q11 10 18 24 l-6 18 q-12-17-25-26 q-23-17-69-16 q-43 1-69 28z" fill="${hair}"/>
      <path d="M114 63 q49-19 101 12" fill="none" stroke="#3b584f" stroke-width="8" stroke-linecap="round" opacity=".7"/>
      <path d="M111 74 Q76 84 79 151 Q81 182 106 202 L113 236 Q154 252 191 231 L201 196 Q223 184 230 157 Q239 117 211 87 Q170 49 111 74Z" fill="${skin}" stroke="#c38c6d" stroke-width="3.2"/>
      <ellipse cx="149" cy="142" rx="4" ry="4.6" fill="#43322c"/>
      <path d="M178 140 q10-7 22 0" fill="none" stroke="#4e3b34" stroke-width="4" stroke-linecap="round"/>
      <path d="M204 150 q24 10 1 26" stroke="#c48f71" stroke-width="3" fill="none"/>
      ${mouthPath}
      <path d="M194 108 q13 4 24 16" fill="none" stroke="#355047" stroke-width="7" stroke-linecap="round"/>
      <path d="M102 237 L96 282 L228 282 L203 199 Q166 215 113 236" fill="${shirt}"/>
      <path d="M95 282 q65 13 134 0" fill="none" stroke="#6ca0b6" stroke-width="12" stroke-linecap="round" opacity=".45"/>
    </g>`;
}
function hand(x,y,rot=0,side='right'){
  const sx = side==='left' ? -1 : 1;
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sx} 1)"><path d="M0 0 c12-10 34-8 43 3 c8 9 10 28 2 39 c-8 11-25 12-36 10 c-8-1-14-6-17-12 c-5-10-4-31 8-40z" fill="${skin}" stroke="#c38c6d" stroke-width="2.5"/><path d="M28 5 c3-14 18-17 24-10 c4 5 2 13-3 16" fill="none" stroke="#c38c6d" stroke-width="2.5" stroke-linecap="round"/></g>`;
}
function arrow(x1,y1,x2,y2,label=''){
  return `<g class="slide"><path d="M${x1} ${y1} L${x2} ${y2}" stroke="#f0b332" stroke-width="8" stroke-linecap="round"/><path d="M${x2-8} ${y2-8} l15 8 -15 8" fill="#f0b332" transform="rotate(${Math.atan2(y2-y1,x2-x1)*180/Math.PI} ${x2} ${y2})"/></g>${label?`<g class="pulse"><ellipse cx="${x2+18}" cy="${y2-16}" rx="22" ry="14" fill="#fff5b7" stroke="#d5b443"/><text x="${x2+18}" y="${y2-11}" font-size="12" text-anchor="middle" font-weight="700" fill="#8c6b11">${label}</text></g>`:''}`;
}
function breath(dir='out'){
  const color=dir==='out'?'#e0a43d':'#20a37a';
  return `<g class="breath" stroke="${color}" stroke-width="6" fill="none" stroke-linecap="round"><path d="M235 144 Q274 131 307 144"/><path d="M236 164 Q278 164 310 166"/><path d="M236 184 Q272 197 304 188"/></g>`;
}
function startScene(){
  return `<svg viewBox="0 0 380 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="190" cy="294" rx="127" ry="10" fill="#dcebe3"/>${faceBase('right','smile')}<g transform="translate(182 98) scale(.56)">${inhaler(true,false)}</g><circle cx="302" cy="84" r="32" fill="#eaf6ef" stroke="${green}" stroke-width="3"/><path d="M287 84 l10 10 18-22" stroke="${green}" stroke-width="8" fill="none" stroke-linecap="round"/></svg>`;
}
function scene(i){
  let c='';
  if(i===1){c=`<g transform="translate(-5 5)">${inhaler(true,false)}</g>${hand(123,112,-22,'left')}${hand(235,206,18,'right')}${arrow(266,212,304,212,'ดัน')}`;}
  if(i===2){c=`<g transform="translate(-10 0)">${inhaler(true,true)}</g>${hand(118,146,-15,'left')}${hand(290,175,12,'right')}${arrow(194,245,265,245,'คลิก')}`;}
  if(i===3){c=`${faceBase('right','open')}${breath('out')}<g transform="translate(280 110) scale(.28)">${inhaler(true,true)}</g>`;}
  if(i===4){c=`${faceBase('right','inhale')}<g transform="translate(153 110) scale(.52)">${inhaler(true,true)}</g><path d="M281 171 Q242 154 214 173" fill="none" stroke="${green}" stroke-width="9" stroke-linecap="round" class="breath"/>`;}
  if(i===5){c=`${faceBase('right','smile')}<g transform="translate(145 112) scale(.50)">${inhaler(true,true)}</g><circle cx="292" cy="121" r="50" fill="#eaf6ef" stroke="${green}" stroke-width="4" class="pulse"/><text x="292" y="133" font-size="34" font-weight="800" text-anchor="middle" fill="${green}">10</text><text x="292" y="165" font-size="13" text-anchor="middle" fill="${deep}">วินาที</text>`;}
  if(i===6){c=`${faceBase('right','open')}${breath('out')}`;}
  if(i===7){c=`<g transform="translate(-5 5)">${inhaler(false,false)}</g>${hand(124,114,-22,'left')}${hand(233,208,18,'right')}${arrow(299,211,255,211,'ปิด')}`;}
  return `<svg viewBox="0 0 380 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="190" cy="294" rx="127" ry="10" fill="#dcebe3"/>${c}</svg>`;
}
function updateNote(){
  el('note').textContent = started && position===steps.length-1 ? 'หมายเหตุ: หลังใช้ยาพ่นที่มีสเตียรอยด์ ควรบ้วนปากด้วยน้ำแล้วบ้วนทิ้ง' : 'หมายเหตุ: ทำตามทีละขั้นตอน เมื่อทำเสร็จแล้วจึงกดปุ่ม “ทำแล้ว ถัดไป”';
}
function render(){
  if(!started){
    el('stepnum').textContent='เริ่มต้นการฝึก';
    el('percent').textContent='0%';
    el('fill').style.width='0%';
    el('heading').textContent='พร้อมเริ่มฝึก';
    el('instruction').textContent='กด “เริ่ม” แล้วทำตามทีละขั้นตอน';
    el('tip').textContent='มีภาพสาธิตและเสียงอ่านให้ทุกขั้นตอน';
    el('art').innerHTML=startScene();
    el('back').disabled=true;
    el('next').textContent='เริ่ม';
    el('announce').textContent='พร้อมเริ่มฝึก';
    updateNote();
    return;
  }
  const s=steps[position];
  el('stepnum').textContent=`ขั้นตอนที่ ${position+1} จาก ${steps.length}`;
  el('percent').textContent=`${Math.round((position+1)*100/steps.length)}%`;
  el('fill').style.width=((position+1)*100/steps.length)+'%';
  el('heading').textContent=s.title;
  el('instruction').textContent=s.say;
  el('tip').textContent=s.tip;
  el('art').innerHTML=scene(s.scene);
  el('back').disabled=position===0;
  el('next').textContent=position===steps.length-1?'✓ เริ่มใหม่':'ทำแล้ว ถัดไป →';
  el('announce').textContent=s.title+' '+s.say;
  updateNote();
}
el('back').onclick=()=>{ if(!started) return; if(position>0){position--; render(); speakCurrent();} };
el('next').onclick=()=>{
  if(!started){started=true; position=0; render(); speakCurrent(); return;}
  if(position===steps.length-1){started=false; position=0; if('speechSynthesis' in window) speechSynthesis.cancel(); render(); return;}
  position++; render(); speakCurrent();
};
el('again').onclick=()=>{ const a=el('art'); a.innerHTML=''; requestAnimationFrame(()=>a.innerHTML=started?scene(steps[position].scene):startScene()); };
el('speak').onclick=()=>{ if(!started) return; if(!('speechSynthesis' in window)){alert('อุปกรณ์นี้ไม่รองรับเสียงอ่าน กรุณาอ่านข้อความบนหน้าจอ'); return;} speakCurrent(); };
if('speechSynthesis' in window && speechSynthesis.onvoiceschanged !== undefined){ speechSynthesis.onvoiceschanged = ()=>{}; }
render();
</script>
</body>
</html>
