:root{--green:#086642;--gold:#dbb337;--ink:#17362c;--muted:#61756b;--bg:#f2f8f5;--line:#d9e7df}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",Tahoma,sans-serif;color:var(--ink);background:var(--bg)}.app{max-width:530px;min-height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 30px #0a5d3312}.top{display:flex;align-items:center;gap:10px;padding:9px 16px 8px;border-bottom:1px solid var(--line);min-height:72px}.logo{width:53px;height:53px;object-fit:contain;flex:none}.hospital{font-size:17px;font-weight:800;color:var(--green);line-height:1.22}.sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}.progress{padding:11px 18px 4px}.progline{display:flex;justify-content:space-between;align-items:center;font-weight:750;font-size:14px}.track{height:7px;border-radius:20px;background:#e4ede7;overflow:hidden;margin-top:8px}.fill{height:100%;width:11.11%;background:var(--green);border-radius:20px;transition:width .2s}.content{flex:1;display:flex;flex-direction:column;padding:9px 16px 6px;min-height:0}.art{position:relative;flex:1;min-height:165px;max-height:360px;background:#f5faf7;border:1px solid #e5eee9;border-radius:22px;display:flex;align-items:center;justify-content:center;overflow:hidden}.art svg{width:100%;height:100%;max-height:340px;min-height:160px}.art:after{content:"ภาพสาธิต";position:absolute;top:12px;left:14px;color:#648477;font-size:11px}.caption{min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 5px 3px}.stephead{font-size:clamp(22px,6.2vw,30px);font-weight:850;line-height:1.3;margin:0}.instruction{margin:8px 0 0;line-height:1.5;font-size:clamp(17px,4.7vw,21px);font-weight:550}.tip{min-height:30px;text-align:center;color:#687a70;font-size:12px;padding:2px 14px}.bottom{padding:10px 16px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}.nav{display:grid;grid- el('back').onclick=()=>{if(position>0){position--;render()}};el('next').onclick=()=>{position=position===steps.length-1?0:position+1;render()};el('again').onclick=()=>{const a=el('art');a.innerHTML='';requestAnimationFrame(()=>a.innerHTML=scene(steps[position].scene))};el('speak').onclick=()=>{if(!('speechSynthesis' in window)){alert('อุปกรณ์นี้ไม่รองรับเสียงอ่าน กรุณาอ่านข้อความบนหน้าจอ');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(steps[position].title+' '+steps[position].say);u.lang='th-TH';u.rate=.88;speechSynthesis.speak(u)}catch(e){alert('ไม่สามารถอ่านออกเสียงได้ กรุณาอ่านข้อความบนหน้าจอ')}};render();
</script></body></html>
